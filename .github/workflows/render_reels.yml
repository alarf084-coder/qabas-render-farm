name: Qabas Render Farm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'نوع التشغيل (test للتجربة السريعة أو render للرندرة الفعلية)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - render
      job_folder:
        description: 'مجلد المشروع (في حالة render)'
        required: false
        default: 'jobs/latest'

jobs:
  build_and_render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Deno (for yt-dlp EJS solver)
        uses: denoland/setup-deno@v2

      - name: Install FFmpeg, yt-dlp EJS & PO Token Server
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          mkdir -p ~/.config/yt-dlp
          printf "%s\n" "--js-runtimes deno" "--js-runtimes node" "--remote-components ejs:github" > ~/.config/yt-dlp/config

      - name: Create Output Directory
        run: mkdir -p out

      - name: Run Test Mode (Fast Bridge Check)
        if: ${{ inputs.mode == 'test' }}
        run: |
          ffmpeg -f lavfi -i color=c=0xF4EFE4:s=1080x1920:d=3 -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac out/test_qabas_bridge.mp4

      - name: Run Remotion Render Mode
        if: ${{ inputs.mode == 'render' }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" | tr -d '\r' > cookies.txt
            cp cookies.txt "${{ inputs.job_folder }}/cookies.txt"
            export YT_COOKIES_FILE="$PWD/cookies.txt"
          fi
          if [ -f "${{ inputs.job_folder }}/run.sh" ]; then
            sed -i 's/android,web/tv/g; s/ios,web/mweb/g; s/tv_embedded,web/web_creator/g; s/visionos,web/web/g' "${{ inputs.job_folder }}/run.sh"
            chmod +x "${{ inputs.job_folder }}/run.sh"
            bash "${{ inputs.job_folder }}/run.sh"
          else
            echo "لم يتم العثور على ملف run.sh داخل ${{ inputs.job_folder }}"
            exit 1
          fi

      - name: Upload All Rendered MP4s to Google Drive
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
        run: |
          for file in out/*.mp4; do
            [ -e "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading $filename to Google Drive..."
            base64 -w 0 "$file" > /tmp/video.b64
            response=$(curl -sL --data-binary @/tmp/video.b64 "${DRIVE_WEBHOOK_URL}?secret=${DRIVE_SECRET}&filename=${filename}")
            echo "Drive Response: $response"
          done
